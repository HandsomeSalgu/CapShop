name: AWS Deployment Pipeline

on:
  push:
    branches: ["main"]

env:
  AWS_REGION: ap-northeast-2

jobs:
  # ================= PHASE 1: Frontend (S3 + CloudFront) =================
  deploy-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/web/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: ./frontend/web
        run: npm ci

      - name: Build Frontend
        working-directory: ./frontend/web
        env:
          VITE_BACKEND_BASE_URL: ${{ secrets.VITE_BACKEND_BASE_URL }}
        run: npm run build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to S3
        run: |
          aws s3 sync frontend/web/dist "s3://${{ secrets.AWS_S3_BUCKET_NAME }}" \
            --delete \
            --cache-control "max-age=31536000" \
            --exclude "index.html"

          # index.html은 캐시하지 않음 (배포 즉시 반영)
          aws s3 cp frontend/web/dist/index.html "s3://${{ secrets.AWS_S3_BUCKET_NAME }}/index.html" \
            --cache-control "no-cache, no-store, must-revalidate"

      - name: Invalidate CloudFront Cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"

  # ================= PHASE 2: Build & Push Docker Images to ECR =================
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 23
        uses: actions/setup-java@v4
        with:
          java-version: '23'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build Backend with Maven
        working-directory: ./backend
        run: chmod +x ./mvnw && ./mvnw clean package -DskipTests

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Backend Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t "$ECR_REGISTRY/${{ secrets.AWS_ECR_BACKEND_REPO }}:latest" .
          docker push "$ECR_REGISTRY/${{ secrets.AWS_ECR_BACKEND_REPO }}:latest"

      - name: Build and Push AI Server Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t "$ECR_REGISTRY/${{ secrets.AWS_ECR_AI_REPO }}:latest" ./ai-server
          docker push "$ECR_REGISTRY/${{ secrets.AWS_ECR_AI_REPO }}:latest"

  # ================= PHASE 3: EC2 - Pull & Run only =================
  deploy-to-ec2:
    needs: build-and-push
    runs-on: ubuntu-latest
    # 같은 보안 그룹을 사용하는 배포가 겹치지 않도록 직렬화한다.
    concurrency:
      group: capshop-ec2-deploy
      cancel-in-progress: false
    env:
      EC2_SECURITY_GROUP_ID: sg-0d5d069bfcaac365f

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # EC2에 필요한 파일 묶음 생성: compose 파일 + .env 파일들 + DB 초기화 스크립트
      - name: Prepare deploy bundle
        env:
          BACKEND_ENV: ${{ secrets.BACKEND_ENV_FILE }}
          AI_SERVER_ENV: ${{ secrets.AI_SERVER_ENV_FILE }}
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
        run: |
          mkdir -p bundle/backend bundle/ai-server bundle/database
          printf '%s\n' "$BACKEND_ENV"   > bundle/backend/.env
          printf '%s\n' "$AI_SERVER_ENV" > bundle/ai-server/.env
          cp docker-compose.prod.yml bundle/
          cp database/schema.sql bundle/database/

          # docker compose 변수 치환용 루트 .env (compose가 자동으로 읽음)
          {
            echo "AWS_ACCOUNT_ID=$AWS_ACCOUNT_ID"
            echo "AWS_REGION=$AWS_REGION"
            echo "MYSQL_PASSWORD=$MYSQL_PASSWORD"
          } > bundle/.env

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Allow runner SSH temporarily
        id: ssh-access
        run: |
          RUNNER_IP=$(curl -4 --fail --silent --show-error --retry 3 --connect-timeout 5 --max-time 15 https://checkip.amazonaws.com)
          python3 -c 'import ipaddress, sys; ipaddress.IPv4Address(sys.argv[1])' "$RUNNER_IP"
          RULE_ID=$(aws ec2 authorize-security-group-ingress \
            --group-id "$EC2_SECURITY_GROUP_ID" \
            --ip-permissions "IpProtocol=tcp,FromPort=22,ToPort=22,IpRanges=[{CidrIp=$RUNNER_IP/32,Description=CapShop-Actions-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT}]" \
            --query 'SecurityGroupRules[0].SecurityGroupRuleId' --output text)
          echo "rule_id=$RULE_ID" >> "$GITHUB_OUTPUT"

      - name: Setup SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          if [ -z "$EC2_HOST" ] || [ -z "$EC2_SSH_KEY" ]; then
            echo "::error::EC2_HOST and EC2_SSH_KEY must be configured."
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/capshop-key.pem
          chmod 600 ~/.ssh/capshop-key.pem
          ssh-keygen -y -P '' -f ~/.ssh/capshop-key.pem > /dev/null
          # 보안 그룹 변경 전파를 기다리며 재시도한다.
          for attempt in 1 2 3 4 5; do
            if ssh-keyscan -T 5 -H "$EC2_HOST" > ~/.ssh/capshop-hostkeys.tmp; then
              cat ~/.ssh/capshop-hostkeys.tmp >> ~/.ssh/known_hosts
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "::error::SSH host key scan failed. Check EC2_HOST, instance status, and TCP 22 connectivity."
              exit 1
            fi
            sleep 2
          done

      - name: Copy bundle to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          tar -czf - -C bundle . | \
            ssh -i ~/.ssh/capshop-key.pem "$EC2_USER@$EC2_HOST" \
              "mkdir -p ~/capshop && tar -xzf - -C ~/capshop && chmod 600 ~/capshop/.env ~/capshop/backend/.env ~/capshop/ai-server/.env"

      - name: Pull images & restart containers on EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/capshop-key.pem "$EC2_USER@$EC2_HOST" bash -s <<'EOF'
          set -e
          cd ~/capshop

          # compose 루트 .env에서 계정/리전 읽기
          set -a
          source .env
          set +a

          # ECR 로그인 (EC2에 붙은 IAM Role 권한 사용)
          aws ecr get-login-password --region "$AWS_REGION" | \
            docker login --username AWS --password-stdin "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"

          # 새 이미지 pull 후 컨테이너 교체
          docker compose -f docker-compose.prod.yml pull backend ai-server
          docker compose -f docker-compose.prod.yml up -d

          # 오래된 이미지 정리
          docker image prune -f

          docker compose -f docker-compose.prod.yml ps
          EOF

      - name: Remove temporary runner SSH rule
        if: ${{ always() && steps.ssh-access.outputs.rule_id != '' }}
        env:
          SSH_RULE_ID: ${{ steps.ssh-access.outputs.rule_id }}
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id "$EC2_SECURITY_GROUP_ID" \
            --security-group-rule-ids "$SSH_RULE_ID"
