name: AWS Deployment Pipeline

# ⚠️ 임시 비활성화: AWS 리소스 준비 후 활성화
# 현재는 deploy.yml (self-hosted runner)을 사용합니다.
on:
  push:
    branches: ["main-aws-deployment"]  # main이 아닌 다른 브랜치로 변경

env:
  AWS_REGION: us-east-1  # 본인 리전으로 변경

jobs:
  # ======================== PHASE 1: Frontend (S3 + CloudFront) ========================
  deploy-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Frontend 빌드
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/web/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: ./frontend/web
        run: npm ci

      - name: Build Frontend
        working-directory: ./frontend/web
        env:
          VITE_BACKEND_BASE_URL: ${{ secrets.VITE_BACKEND_BASE_URL }}
        run: npm run build

      # S3에 배포
      - name: Deploy to S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          aws s3 sync frontend/web/dist s3://${{ secrets.AWS_S3_BUCKET_NAME }} \
            --region $AWS_REGION \
            --delete \
            --cache-control "max-age=31536000" \
            --exclude "index.html"

          # index.html은 캐시하지 않음 (매번 최신 버전 로드)
          aws s3 cp frontend/web/dist/index.html s3://${{ secrets.AWS_S3_BUCKET_NAME }}/index.html \
            --region $AWS_REGION \
            --cache-control "no-cache, no-store, must-revalidate"

      # CloudFront 캐시 무효화
      - name: Invalidate CloudFront Cache
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*" \
            --region $AWS_REGION

  # ======================== PHASE 2: Backend + AI (EC2 Docker Compose) ========================
  deploy-backend:
    needs: deploy-frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # EC2에 SSH 연결 후 배포
      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          BACKEND_ENV: ${{ secrets.BACKEND_ENV_FILE }}
          AI_SERVER_ENV: ${{ secrets.AI_SERVER_ENV_FILE }}
        run: |
          # SSH 키 설정
          mkdir -p ~/.ssh
          echo "$EC2_SSH_KEY" > ~/.ssh/capshop-key.pem
          chmod 600 ~/.ssh/capshop-key.pem

          # SSH 호스트 키 스캔 자동 승인
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

          # EC2에 코드 배포
          ssh -i ~/.ssh/capshop-key.pem "$EC2_USER@$EC2_HOST" << 'EOF'
          cd ~/capshop

          # 최신 코드 다운로드
          git fetch origin main
          git checkout origin/main

          # .env 파일 생성 (GitHub Secrets에서)
          cat > backend/.env << 'ENV_END'
          $BACKEND_ENV
          ENV_END

          cat > ai-server/.env << 'ENV_END'
          $AI_SERVER_ENV
          ENV_END

          # Docker Compose 실행 (프로덕션 설정)
          docker-compose -f docker-compose.prod.yml down
          docker-compose -f docker-compose.prod.yml build --no-cache
          docker-compose -f docker-compose.prod.yml up -d

          # 컨테이너 상태 확인
          docker-compose -f docker-compose.prod.yml ps

          # 보안: .env 파일 삭제 (배포 완료 후 평문 노출 방지)
          rm -f backend/.env ai-server/.env
          echo "✅ .env files cleaned up on EC2"
          EOF

      - name: Notify Deployment Success
        run: echo "Backend and AI Server deployed successfully to EC2"

# ======================== 선택사항: 배포 실패 시 알림 ========================
  notify-failure:
    runs-on: ubuntu-latest
    needs: [deploy-frontend, deploy-backend]
    if: failure()

    steps:
      - name: Send Failure Notification
        run: |
          echo "Deployment failed! Check GitHub Actions logs."
          # Slack/Discord 알림 추가 가능
