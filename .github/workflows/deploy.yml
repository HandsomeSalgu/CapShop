name: CI/CD Deploy Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
    # 0. Git safe.directory 설정
    - name: 0. Fix git safe.directory
      run: git config --global --add safe.directory '*'

    # 1. 코드 다운로드
    - name: 1. Checkout Repository
      uses: actions/checkout@v4

    # 1.5 .env 파일 생성 (배치 파일 방식)
    - name: 1.5 Create .env files from GitHub Secrets
      shell: cmd
      env:
        BACKEND_ENV: ${{ secrets.BACKEND_ENV_FILE }}
        AI_SERVER_ENV: ${{ secrets.AI_SERVER_ENV_FILE }}
        FRONTEND_ENV: ${{ secrets.FRONTEND_ENV_FILE }}
      run: |
        (echo %BACKEND_ENV%) > backend\.env
        (echo %AI_SERVER_ENV%) > ai-server\.env
        (echo %FRONTEND_ENV%) > frontend\web\.env

    # 2. Maven 빌드
    - name: 2. Build with Maven
      working-directory: ./backend
      shell: cmd
      run: mvnw.cmd clean package -DskipTests

    # 3. Docker Compose 배포
    - name: 3. Deploy via Docker Compose
      shell: cmd
      run: |
        docker compose build backend
        docker compose build frontend
        docker compose build ai-server
        docker compose up -d

    # 3.5 보안: .env 파일 삭제 (배치 파일 방식)
    - name: "3.5 Cleanup: Remove .env files for security"
      if: always()
      shell: cmd
      run: |
        del /q backend\.env 2>nul
        del /q ai-server\.env 2>nul
        del /q frontend\web\.env 2>nul
        echo .env files cleaned up
