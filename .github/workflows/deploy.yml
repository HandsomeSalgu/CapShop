name: CI/CD Deploy Pipeline

on:
  # AWS 배포로 전환됨 - 이 워크플로는 수동 실행 전용 (deploy-aws.yml이 메인)
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
    - name: 0. Checkout Repository
      uses: actions/checkout@v4

    - name: 0.5 Setup Java 23
      uses: actions/setup-java@v4
      with:
        java-version: '23'
        distribution: 'temurin'

    - name: 1. Create .env files from GitHub Secrets
      shell: powershell
      env:
        BACKEND_ENV: ${{ secrets.BACKEND_ENV_FILE }}
        AI_SERVER_ENV: ${{ secrets.AI_SERVER_ENV_FILE }}
        FRONTEND_ENV: ${{ secrets.FRONTEND_ENV_FILE }}
      run: |
        [System.IO.File]::WriteAllText("backend/.env", $env:BACKEND_ENV)
        [System.IO.File]::WriteAllText("ai-server/.env", $env:AI_SERVER_ENV)
        [System.IO.File]::WriteAllText("frontend/web/.env", $env:FRONTEND_ENV)

    - name: 2. Build with Maven
      working-directory: ./backend
      shell: cmd
      run: mvnw.cmd clean package -DskipTests

    # Docker Desktop이 설치되지 않았으므로 스킵
    # AWS 배포 시 Docker Compose 사용 (deploy-aws.yml)
    # - name: 3. Deploy via Docker Compose
    #   shell: cmd
    #   run: |
    #     docker compose build backend
    #     docker compose build frontend
    #     docker compose build ai-server
    #     docker compose up -d

    - name: 3. Build Success (Docker Deploy Skipped)
      shell: cmd
      run: echo "Maven build successful. Docker deployment skipped (AWS only)."

    - name: 4. Cleanup .env files
      if: always()
      shell: cmd
      run: |
        del /q backend\.env 2>nul || echo.
        del /q ai-server\.env 2>nul || echo.
        del /q frontend\web\.env 2>nul || echo.
