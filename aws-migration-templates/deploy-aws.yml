name: Deploy to AWS

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    # 1. 저장소에서 최신 코드 다운로드
    - name: 1. Checkout Repository
      uses: actions/checkout@v4

    # 2. 백엔드 빌드 환경 설정
    - name: 2.1 Set up JDK 23
      uses: actions/setup-java@v3
      with:
        java-version: '23'
        distribution: 'temurin'

    # 3. 백엔드 .env 파일 생성
    - name: 2.2 Create backend .env from secrets
      run: |
        echo "${{ secrets.BACKEND_ENV_FILE }}" > backend/.env
        chmod 600 backend/.env

    # 4. 백엔드 빌드
    - name: 2.3 Build Backend with Maven
      working-directory: ./backend
      run: ./mvnw clean package -DskipTests

    # 5. 프론트엔드 빌드 환경 설정
    - name: 3.1 Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'

    # 6. 프론트엔드 .env 파일 생성
    - name: 3.2 Create frontend .env from secrets
      run: |
        echo "${{ secrets.FRONTEND_ENV_FILE }}" > frontend/web/.env.production
        chmod 600 frontend/web/.env.production

    # 7. 프론트엔드 빌드
    - name: 3.3 Build Frontend
      working-directory: ./frontend/web
      run: |
        npm install --legacy-peer-deps
        npm run build

    # 8. AWS 자격증명 설정 (S3, CloudFront 접근용)
    - name: 4.1 Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        # 방법 1: 액세스 키 (간단하지만 보안 위험)
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ap-northeast-2

        # 방법 2: OIDC 토큰 (권장, 보안성 높음)
        # role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
        # role-session-name: GitHubActions
        # aws-region: ap-northeast-2

    # 9. 프론트엔드를 S3에 배포
    - name: 4.2 Deploy Frontend to S3
      run: |
        aws s3 sync frontend/web/dist s3://${{ secrets.S3_BUCKET_NAME }} \
          --delete \
          --cache-control "public, max-age=3600" \
          --region ap-northeast-2
        echo "Frontend deployed to S3"

    # 10. CloudFront 캐시 무효화
    - name: 4.3 Invalidate CloudFront Cache
      run: |
        aws cloudfront create-invalidation \
          --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
          --paths "/*" \
          --region us-east-1
        echo "CloudFront cache invalidated"

    # 11. EC2에 배포 (SSH)
    - name: 5. Deploy to EC2
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        port: 22
        script: |
          set -e

          echo "=== EC2 배포 시작 ==="

          # 프로젝트 디렉토리로 이동
          cd /home/${{ secrets.EC2_USERNAME }}/CapShop || exit 1

          # 최신 코드 다운로드
          echo "Git pull 실행 중..."
          git pull origin main

          # .env 파일 생성 (GitHub Secrets에서)
          echo "환경변수 파일 생성 중..."
          cat > backend/.env << 'EOF'
          ${{ secrets.BACKEND_ENV_FILE }}
          EOF
          chmod 600 backend/.env

          cat > ai-server/.env << 'EOF'
          ${{ secrets.AI_SERVER_ENV_FILE }}
          EOF
          chmod 600 ai-server/.env

          # Docker 컨테이너 재구동
          echo "Docker Compose 실행 중..."
          docker compose -f docker-compose.prod.yml down || true
          docker compose -f docker-compose.prod.yml up -d --build

          echo "=== EC2 배포 완료 ==="

    # 12. 배포 실패 시 알림 (선택사항)
    - name: 6. Notify Deployment Status
      if: always()
      run: |
        if [ "${{ job.status }}" = "success" ]; then
          echo "✅ 배포 성공"
        else
          echo "❌ 배포 실패"
        fi

# ===== GitHub Secrets 설정 필요 =====
#
# Backend/AI Server 환경변수:
# - BACKEND_ENV_FILE: backend/.env 파일 전체 내용 (개행 포함)
# - AI_SERVER_ENV_FILE: ai-server/.env 파일 전체 내용 (개행 포함)
# - FRONTEND_ENV_FILE: frontend/web/.env.production 파일 전체 내용 (개행 포함)
#
# AWS S3/CloudFront:
# - AWS_ACCESS_KEY_ID: AWS 액세스 키 (또는 OIDC 사용)
# - AWS_SECRET_ACCESS_KEY: AWS 시크릿 액세스 키 (또는 OIDC 사용)
# - S3_BUCKET_NAME: 프론트엔드 배포 S3 버킷 이름
# - CLOUDFRONT_DISTRIBUTION_ID: CloudFront 배포 ID
#
# EC2 SSH:
# - EC2_HOST: EC2 퍼블릭 IP 또는 도메인
# - EC2_USERNAME: EC2 사용자명 (기본: ec2-user 또는 ubuntu)
# - EC2_SSH_KEY: EC2 프라이빗 키 (전체 내용, PEM 형식)
#
# AWS Role ARN (OIDC 사용 시):
# - AWS_ROLE_ARN: arn:aws:iam::ACCOUNT_ID:role/GitHubActionsRole
#
# ===== GitHub Secrets 생성 방법 =====
# 1. GitHub 저장소 → Settings → Secrets and variables → Actions
# 2. "New repository secret" 클릭
# 3. Name: BACKEND_ENV_FILE, Value: (backend/.env 파일 전체 내용 복사)
# 4. Add secret 클릭
# 5. 나머지 secrets도 동일하게 추가
#
# .env 파일을 Secret으로 추가할 때 주의사항:
# - 파일의 개행 문자가 유지되어야 함 (탭이나 공백 주의)
# - 민감한 정보이므로 접근 권한 제한 필수
# - 정기적으로 값 업데이트 (특히 API 키)
