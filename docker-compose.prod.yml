name: capshop-prod

services:
  backend:
    # ECR에서 이미지 pull (GitHub Actions에서 빌드 후 푸시)
    image: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/capshop-backend:latest
    env_file:
      - ./backend/.env
    environment:
      # ========== AWS 배포 환경 변수 (로컬과 다른 부분) ==========
      # RDS 사용 시: AWS RDS 엔드포인트로 변경 (예: capshop-db.xxxx.us-east-1.rds.amazonaws.com)
      # EC2 내부 MySQL 사용 시: localhost:3306 또는 mysql:3306 (docker compose 내)
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/syncshopper?serverTimezone=Asia/Seoul&characterEncoding=UTF-8

      # ElastiCache 사용 시: ElastiCache 엔드포인트로 변경
      # EC2 내부 Redis 사용 시: redis:6379 유지
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379

      # AI 서버 (EC2 내 docker-compose)
      - APP_AI_FASTAPI_BASE_URL=http://ai-server:8000
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - capshop-network

  ai-server:
    # ECR에서 이미지 pull (GitHub Actions에서 빌드 후 푸시)
    image: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/capshop-ai-server:latest
    env_file:
      - ./ai-server/.env
    environment:
      # 로컬과 동일하게 유지 (EC2 내부 통신)
      - BACKEND_BASE_URL=http://backend:8080
      - DB_HOST=mysql
      - DB_PORT=3306
    ports:
      # AI 서버는 backend가 도커 내부 네트워크로 호출하므로 외부 노출 불필요 (디버깅용 localhost만)
      - "127.0.0.1:8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - capshop-network

  # ========== MySQL ==========
  mysql:
    image: mysql:8.0
    environment:
      - MYSQL_DATABASE=syncshopper
      - MYSQL_ROOT_PASSWORD=${MYSQL_PASSWORD}
      # 애플리케이션 전용 계정 (syncshopper DB 권한만 부여됨)
      - MYSQL_USER=capshop
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    ports:
      # 외부 노출 금지 — EC2 내부에서 디버깅할 때만 localhost로 접근
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    restart: unless-stopped
    networks:
      - capshop-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # ========== Redis ==========
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      # 외부 노출 금지
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - capshop-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      timeout: 3s
      retries: 5

volumes:
  mysql_data:
  redis_data:

networks:
  capshop-network:
    driver: bridge
